name: Amin VPN ARMv7 experimental build

# Builds OpenRung's libbox engine (armeabi-v7a slice included) from third_party/openrung, runs the
# upstream Go tests and the ported Kotlin unit tests, then assembles a signed armeabi-v7a APK.
# Tags matching v*-experimental* publish a GitHub PRE-release only (never a stable release).
on:
  workflow_dispatch:
  push:
    branches: [amin-vpn-openrung-armv7]
    tags: ['v*-experimental*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17' # sing-box's build_libbox requires OpenJDK 17

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false

      - uses: android-actions/setup-android@v3

      - name: Install NDK 29 (links libbox, incl. armeabi-v7a)
        run: sdkmanager "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache libbox.aar
        id: libbox
        uses: actions/cache@v4
        with:
          path: third_party/openrung/android/app/libs/libbox.aar
          key: libbox-${{ hashFiles('third_party/openrung/**') }}

      - name: Install gomobile (sagernet fork pinned by sing-box)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Build OpenRung libbox.aar (tests run inside the script)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$HOME/go/bin:$PATH"
          bash third_party/openrung/android/build-libbox-release.sh

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.AMIN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::AMIN_KEYSTORE_BASE64 is not set: engine + tests ran, but no APK is signed or published (never debug-signed)."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/amin.keystore"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Build signed armeabi-v7a APK
        if: steps.key.outputs.present == 'true'
        env:
          AMIN_KEYSTORE_FILE: ${{ runner.temp }}/amin.keystore
          AMIN_KEYSTORE_PASSWORD: ${{ secrets.AMIN_KEYSTORE_PASSWORD }}
          AMIN_KEY_ALIAS: ${{ secrets.AMIN_KEY_ALIAS }}
          AMIN_KEY_PASSWORD: ${{ secrets.AMIN_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -l "$apk" | grep "lib/" | tee native-libs.txt
          if grep -v "lib/armeabi-v7a/" native-libs.txt | grep -q "lib/"; then echo "::error::non-ARMv7 native lib found"; exit 1; fi
          cp "$apk" Amin-VPN-armv7-experimental.apk
          ls -l Amin-VPN-armv7-experimental.apk

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true'
        with:
          name: Amin-VPN-armv7-experimental
          path: Amin-VPN-armv7-experimental.apk

      - name: Experimental pre-release
        if: startsWith(github.ref, 'refs/tags/') && steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Amin-VPN-armv7-experimental.apk \
            --prerelease --title "Amin VPN $GITHUB_REF_NAME (ARMv7, untested in Iran)" \
            --notes "Experimental ARMv7 test build. Not validated in Iran. GPL-3.0 corresponding source: this tag (third_party/openrung + pins)."
